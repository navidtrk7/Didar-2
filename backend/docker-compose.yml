services:
  postgres:
    image: postgres:16-alpine
    container_name: didar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: didar
      POSTGRES_USER: didar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - didar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U didar -d didar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  didar_pgdata:
